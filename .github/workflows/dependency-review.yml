name: Dependency Review

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Opcional: Lista de vulnerabilidades a ignorar (usar com cautela)
          # deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0, Unlicense

      - name: Check for Malicious Packages
        run: |
          echo "## 🔍 Dependency Review Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependências revisadas com sucesso." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Total de dependências: $(npm list --depth=0 --all 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY

