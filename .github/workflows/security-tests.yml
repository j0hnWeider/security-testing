name: Security Tests Pipeline

on:
  push:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'imagem/**'
      - '.gitignore'
  pull_request:
    branches: [main, master, develop]
    paths-ignore:
      - '**.md'
      - 'imagem/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: '22'
  API_BASE_URL: 'https://serverest.dev'
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

  security-tests:
    name: Security Tests (Playwright)
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Clean previous reports
        run: |
          rm -rf playwright-report allure-results test-results
          mkdir -p playwright-report allure-results test-results

      - name: Run Security Tests (Shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: security-tests
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Tests with Coverage
        run: npm run test:coverage
        env:
          API_BASE_URL: ${{ env.API_BASE_URL }}
          CI: 'true'

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Check Coverage Thresholds
        run: npx nyc check-coverage
        continue-on-error: true

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: security-tests
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: allure-results/

      # Restaura histórico de execuções anteriores para gerar o gráfico de tendência (Trend)
      - name: Restore Allure History
        run: |
          curl -s -L https://j0hnweider.github.io/security-testing/history/history.json -o allure-results/history.json 2>/dev/null || echo "Nenhum histórico anterior encontrado."
          curl -s -L https://j0hnweider.github.io/security-testing/history/history-trend.json -o allure-results/history-trend.json 2>/dev/null || echo "Nenhum trend anterior encontrado."
        continue-on-error: true

      # Cria informações do executor (aba Executors)
      - name: Create Executor Info
        run: |
          echo '{
            "name": "GitHub Actions",
            "type": "github",
            "url": "https://github.com/j0hnWeider/security-testing/actions/runs/${{ github.run_id }}",
            "buildOrder": ${{ github.run_number }},
            "buildName": "Security Tests #${{ github.run_number }}",
            "buildUrl": "https://github.com/j0hnWeider/security-testing/actions/runs/${{ github.run_id }}",
            "reportUrl": "https://j0hnweider.github.io/security-testing",
            "reportName": "Allure Report - Security Tests"
          }' > allure-results/executor.json

      # Copia o arquivo de categorias personalizadas
      - name: Copy Categories
        run: cp config/allure/categories.json allure-results/categories.json
        continue-on-error: true

      - name: Generate Allure Report
        run: |
          npx allure generate allure-results --clean -o allure-report
        continue-on-error: true

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

  deploy-allure:
    name: Deploy Allure Report to Pages
    runs-on: ubuntu-latest
    needs: [allure-report]
    if: github.ref == 'refs/heads/main' && always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure Report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: ./allure-report

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, security-tests, coverage]
    if: always()
    steps:
      - run: |
          echo "## Summary of Security Tests Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Lint**: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Tests**: ${{ needs.security-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Coverage**: ${{ needs.coverage.result }}" >> $GITHUB_STEP_SUMMARY